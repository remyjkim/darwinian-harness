      "manifest": {
        "name": "@remyjkim/notion-token",
        "version": "0.1.0",
        "description": "Headless/cloud Notion access via the open-source notion-mcp-server authenticated with a static integration token (NOTION_TOKEN). OAuth-free alternative to @remyjkim/notion-agent. Skills not yet bundled — hosted-server skills require tool-surface adaptation.",
        "servers": {
          "notion": {
            "transport": "stdio",
            "command": "npx",
            "args": [
              "-y",
              "@notionhq/notion-mcp-server"
            ],
            "env": {
              "NOTION_TOKEN": "${NOTION_TOKEN}"
            },
            "description": "Notion MCP via the open-source notion-mcp-server, authenticated with a static Notion integration token. For headless/cloud deploys where the hosted OAuth server is not viable.",
            "optional": false,
            "notes": "Requires a Notion internal integration token (ntn_...) supplied via the NOTION_TOKEN env var — inject as a container secret, never commit. Share the target pages/databases with the integration in Notion. Tool names follow Notion OpenAPI operation ids (API-post-search, API-retrieve-a-page, API-patch-page, API-create-a-comment, API-post-page), which differ from the hosted server's curated notion-* tools — skills written for the hosted server must be adapted."
          }
        }
      },
