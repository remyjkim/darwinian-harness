name: CLI CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUN_VERSION: '1.2.21'
  # Fail fast on any git credential prompt instead of blocking on a missing TTY.
  GIT_TERMINAL_PROMPT: '0'

jobs:
  validate:
    name: Validate
    runs-on: ${{ matrix.os }}
    # Individual Linux tests still fail at 30s through test:gate; this outer bound
    # protects the complete matrix job from normal hosted-runner variance.
    timeout-minutes: 60
    # Linux owns the canonical full suite. macOS and Windows execute the strict
    # management/auth subset plus the shared immutable-artifact qualification below.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Shellcheck strict management journeys
        run: shellcheck test/e2e/drwn-management-cli.sh test/e2e/drwn-management-cli-live.sh test/e2e/lib/assertions.sh

      - name: Typecheck
        run: bun run typecheck

      - name: Unit + integration tests
        if: runner.os == 'Linux'
        # A per-test timeout converts any CI-only spawn hang into a fast failure so the
        # suite always completes (and reports the culprit) instead of burning the job timeout.
        run: bun run test:gate

      - name: Non-Linux management and auth tests
        if: runner.os != 'Linux'
        run: bun test --timeout 30000 test/management-contract-conformance.test.ts test/core-management-transport.test.ts test/core-auth-device-flow.test.ts test/core-auth-resolve-token.test.ts

      - name: Release-readiness gate
        if: runner.os == 'Linux'
        # Test mode runs the release-specific checks (metadata, docs, package contents,
        # schema reachability) without re-running the full bun test / typecheck suite —
        # those already ran as their own steps above. Re-running them here is redundant
        # and previously hung the job until its timeout.
        env:
          QUALITY_GATE_TEST_MODE: '1'
        run: bun run verify:release

  command-bridge:
    name: Command bridge (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install bridge dependencies
        working-directory: drwn-command-bridge
        run: bun install --frozen-lockfile

      - name: Verify bridge package
        run: bun run verify:bridge

  management-artifact:
    name: Pack immutable management artifact
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate exact build identity and pack once
        shell: bash
        run: |
          bun scripts/release/build-identity.ts
          mkdir -p "$RUNNER_TEMP/management-artifact"
          npm pack --ignore-scripts --json \
            --pack-destination "$RUNNER_TEMP/management-artifact" \
            --cache "$RUNNER_TEMP/npm-pack-cache" \
            > "$RUNNER_TEMP/management-artifact/npm-pack.json"
          bun scripts/release-cli.ts qualify-artifact \
            "$RUNNER_TEMP/management-artifact/npm-pack.json" \
            "$RUNNER_TEMP/management-artifact" \
            > "$RUNNER_TEMP/management-artifact/artifact.json"
          shasum -a 256 "$RUNNER_TEMP/management-artifact/darwinian-1.4.2.tgz" | awk '{print $1}' \
            > "$RUNNER_TEMP/management-artifact/artifact-sha256"

      - name: Upload exact tar and digest
        uses: actions/upload-artifact@v4
        with:
          name: management-artifact
          path: |
            ${{ runner.temp }}/management-artifact/darwinian-1.4.2.tgz
            ${{ runner.temp }}/management-artifact/artifact.json
            ${{ runner.temp }}/management-artifact/artifact-sha256
          if-no-files-found: error
          retention-days: 7

  management-three-os:
    name: Management artifact and keychain (macOS current gate)
    needs: [management-artifact]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install source test dependencies
        run: bun install --frozen-lockfile

      - name: Download the one immutable candidate
        uses: actions/download-artifact@v4
        with:
          name: management-artifact
          path: ${{ runner.temp }}/management-artifact

      - name: Verify artifact SHA-256 and install cleanly
        shell: bash
        run: |
          TARBALL="$RUNNER_TEMP/management-artifact/darwinian-1.4.2.tgz"
          EXPECTED_SHA="$(tr -d '[:space:]' < "$RUNNER_TEMP/management-artifact/artifact-sha256")"
          ACTUAL_SHA="$(bun -e 'const p=process.argv[1]; const h=new Bun.CryptoHasher("sha256"); h.update(await Bun.file(p).arrayBuffer()); console.log(h.digest("hex"));' "$TARBALL")"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          npm install --global "$TARBALL" --prefix "$RUNNER_TEMP/drwn-prefix" --cache "$RUNNER_TEMP/npm-cache"
          DRWN_E2E_BIN="$RUNNER_TEMP/drwn-prefix/bin/drwn"
          test -x "$DRWN_E2E_BIN"
          test "$("$DRWN_E2E_BIN" --version)" = "1.4.2"
          printf 'DRWN_E2E_BIN=%s\n' "$DRWN_E2E_BIN" >> "$GITHUB_ENV"
          printf 'ARTIFACT_SHA256=%s\n' "$ACTUAL_SHA" >> "$GITHUB_ENV"

      - name: Run installed hermetic management Bash journey
        shell: bash
        run: bun run test:e2e:management:bash

      - name: Exercise required macOS Keychain custody
        env:
          DRWN_RUN_REAL_KEYCHAIN_TESTS: '1'
        run: bun test test/core-secret-store-backends.test.ts
